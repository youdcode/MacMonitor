name: Build

# Builds the app and runs the test target on a GitHub-hosted Mac.
#
# macos-latest resolved to macOS 26 on arm64 when this was written, which is the same
# major version the project was developed on. The destination says `platform=macOS`
# with no architecture, so it resolves to whichever Mac the runner is, rather than
# failing outright if the label ever points at an Intel image again.
#
# Code signing is deliberately left alone. The project signs ad hoc
# (CODE_SIGN_IDENTITY = "-", no development team), which needs no certificate and no
# secrets. Passing CODE_SIGNING_ALLOWED=NO would be worse than useless here: on Apple
# Silicon an unsigned binary cannot execute at all, so the test host would fail to
# launch.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Record the toolchain
        run: sw_vers

      - name: Record the Xcode version
        run: xcodebuild -version

      - name: Build
        run: xcodebuild build -scheme MacMonitor -destination 'platform=macOS' -derivedDataPath .build

      - name: Test
        # set -o pipefail before the pipe, so a failing xcodebuild is not swallowed by a
        # succeeding tee. The log is kept for the step below, and still printed here.
        run: |
          set -o pipefail
          xcodebuild test -scheme MacMonitor -destination 'platform=macOS' -derivedDataPath .build 2>&1 | tee test.log

      # The gate is not "no warnings", it is "these two, and no others". Two linker
      # warnings are expected and explained in the README: the XCTest shipped with Xcode
      # is built for macOS 14 while the test bundle is declared for 13, which is what its
      # code actually needs. A third one would be a real defect, and without this step it
      # would arrive quietly in a log nobody reads to the end.
      #
      # Measured before being trusted, on the machine this was written on: a clean run
      # prints the two lines once each, with no duplication and no context lines around
      # them, twice in a row; an incremental run prints none, because the linker does not
      # run at all. Both cases sit under the limit, so the step only speaks up when the
      # count grows.
      #
      # EXACTLY two, not at most two. "At most" could disarm itself in silence: if the
      # "ld: warning:" wording ever changed, the count would fall to zero, the step would
      # pass, and it would have stopped guarding anything without saying so. Requiring
      # the exact number makes a change fail in either direction.
      #
      # That is only safe because a runner is a fresh machine. Checked before relying on
      # it: this workflow has no cache step, so .build never survives between runs; the
      # Build step emits none of these warnings because it does not link the test bundle;
      # and the Test step emits both, whether or not Build ran first. ONLY_ACTIVE_ARCH is
      # YES and ARCHS resolves to a single architecture, so the linker runs once per
      # binary rather than once per slice. Measured twice through the whole sequence: 0
      # then 2, both times.
      #
      # IF A CACHE STEP IS EVER ADDED, this exactness dies with it - an incremental run
      # links nothing and prints zero, which now fails. Go back to -gt 2 in that case, or
      # do not cache DerivedData.
      #
      # The limit that remains: it catches a THIRD warning, not a substituted one. Two
      # different ld warnings would still count two, which is why the step prints them
      # for a human to read against the pair quoted in the README.
      - name: Exactly two linker warnings
        run: |
          count=$(grep -c 'ld: warning:' test.log || true)
          echo "linker warnings: $count"
          grep 'ld: warning:' test.log || true
          if [ "$count" -lt 2 ]; then
            echo "::error::$count linker warnings, expected exactly 2. Either the linker did not run - a DerivedData cache would do that - or the 'ld: warning:' wording has changed and this step has stopped guarding anything."
            exit 1
          fi
          if [ "$count" -gt 2 ]; then
            echo "::error::$count linker warnings, expected exactly 2. The two known ones come from XCTest being built for macOS 14 while the test bundle is declared for 13; anything beyond them is a defect, not a fact about Xcode."
            exit 1
          fi
